<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="okOrangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ee7700" />
      <stop offset="100%" stop-color="#cc5500" />
    </linearGradient>

    <!-- Gold Trim Gradient -->
    <linearGradient id="okGoldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#fff4b8" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="okShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#okShadow)">
    <!-- Crown / Cap Base Arches (like a party hat / visor overlay) -->
    <!-- Back Arch -->
    <path d="M 25 105 C 60 70 180 70 215 105 L 205 130 C 170 100 70 100 35 130 Z" fill="#993d00" opacity="0.7" />

    <!-- Main Orange Crown/Cap Body -->
    <path d="M 30 115 C 65 75 175 75 210 115 L 225 90 C 190 40 50 40 15 90 Z" fill="url(#okOrangeGrad)" stroke="#ffd700" stroke-width="2.5" />

    <!-- Crown Spikes / Crest Peaks -->
    <polygon points="50,65 70,30 90,60" fill="url(#okOrangeGrad)" stroke="#ffd700" stroke-width="2" />
    <polygon points="95,50 120,15 145,50" fill="url(#okOrangeGrad)" stroke="#ffd700" stroke-width="2.5" />
    <polygon points="150,60 170,30 190,65" fill="url(#okOrangeGrad)" stroke="#ffd700" stroke-width="2" />

    <!-- Top Jewels on Peaks -->
    <circle cx="70" cy="28" r="6" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <circle cx="120" cy="12" r="8" fill="#ffd700" stroke="#fff" stroke-width="2" />
    <circle cx="170" cy="28" r="6" fill="#ffd700" stroke="#fff" stroke-width="1.5" />

    <!-- Central Odnoklassniki Logo Medallion -->
    <circle cx="120" cy="80" r="34" fill="#ffffff" stroke="url(#okGoldTrim)" stroke-width="4" />

    <!-- OK Human Emblem inside medallion -->
    <!-- Head Circle -->
    <circle cx="120" cy="68" r="11" fill="#ee7700" />
    <!-- Curved Body Arch -->
    <path d="M 106 94 C 106 82 134 82 134 94" fill="none" stroke="#ee7700" stroke-width="6" stroke-linecap="round" />
    <!-- Ribbon Leg Accent -->
    <path d="M 112 90 L 105 103" stroke="#ee7700" stroke-width="5" stroke-linecap="round" />
    <path d="M 128 90 L 135 103" stroke="#ee7700" stroke-width="5" stroke-linecap="round" />

    <!-- Bottom Golden Arch Rim -->
    <path d="M 28 116 C 70 88 170 88 212 116" fill="none" stroke="url(#okGoldTrim)" stroke-width="5" stroke-linecap="round" />

    <!-- Banner Tag: ОДНОКЛАССНИКИ -->
    <rect x="52" y="118" width="136" height="24" rx="6" fill="#ee7700" stroke="#ffd700" stroke-width="1.5" />
    <text x="120" y="135" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">ОДНОКЛАССНИКИ</text>
  </g>
</svg>
